[project]
name = "maelia-backend"
version = "0.1.0"
description = "FastAPI backend for launching MAELIA with GAMA Headless"
authors = [
    {name = "Cheikhou Akhmed Kane",email = "cheikhou.kane@urdfs.edu.sn"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "gama-client (>=2.0.1,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
